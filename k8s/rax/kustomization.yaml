# rax-server on KubeSolo, API only: its store in PGX on the host, no Agent Substrate (docs/KUBESOLO.md,
# "rax on KubeSolo"). Applied by hand over an SSH tunnel with `kubectl apply -k k8s/rax`;
# deploy.yml ignores k8s/**, so a system deploy never touches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ax-system
resources:
  - namespace.yaml
  - rax-server.yaml
images:
  # Published by piabrota/rax's CI (.github/workflows/image.yml, linux/amd64), pinned by digest:
  # this is sha-2037585, rax's main on 2026-10-31: the pod runner (piabrota/rax#10) and the `rax`
  # CLI in the image (piabrota/rax#11), which k8s/agents' CronJobs run. To update, take the digest
  # from the newest `image` run's summary in piabrota/rax, here and in k8s/agents.
  - name: rax-server
    newName: ghcr.io/piabrota/rax-server
    digest: sha256:94c8fd5b2c4badb089b28e2be20164a1148810cbeef011cd6557aee44d97fedd
