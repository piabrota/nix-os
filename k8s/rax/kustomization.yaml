# rax-server on KubeSolo, API only: its store in PGX on the host, no Agent Substrate (docs/KUBESOLO.md,
# "rax on KubeSolo"). Applied by hand over an SSH tunnel with `kubectl apply -k k8s/rax`;
# deploy.yml ignores k8s/**, so a system deploy never touches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ax-system
resources:
  - namespace.yaml
  - rax-server.yaml
images:
  # Published by piabrota/rax's CI (.github/workflows/image.yml, linux/amd64), pinned by digest:
  # this is sha-458aae3, rax's main on 2026-10-31 with the pod runner (piabrota/rax#10). To update,
  # take the digest from the newest `image` run's summary in piabrota/rax.
  - name: rax-server
    newName: ghcr.io/piabrota/rax-server
    digest: sha256:c4dbe0967b97776938e0fe2b8557b6bd537fb48bbedf18c61879afcfd2da64f1
