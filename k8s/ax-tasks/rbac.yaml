# rax-server's service account (k8s/rax, in ax-system) runs task pods here: create, read and delete
# pods, and nothing else in this namespace (not its Secrets: pods read those through envFrom).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rax-server-pods
  namespace: ax-tasks
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rax-server-pods
  namespace: ax-tasks
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rax-server-pods
---
# The task pods' service account (rax-server --pod-service-account=agents): it reads the box's
# health snapshot, which kubesolo.nix writes (piabrota.kubesolo.healthSnapshot), and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents
  namespace: ax-tasks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-read-snapshot
  namespace: ax-tasks
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["health-snapshot"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-read-snapshot
  namespace: ax-tasks
subjects:
  - kind: ServiceAccount
    name: agents
    namespace: ax-tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agents-read-snapshot
