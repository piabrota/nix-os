<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2014" viewBox="0 0 1280 2014" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup B, index: the piabrota.art homepage, 1280 px wide">
<title>Mockup B, index: the piabrota.art homepage, 1280 px wide</title>
<defs></defs>
<rect fill="#FAFAF7" height="2014" width="1280" x="0" y="0"/>
<g><rect fill="#BC2318" height="28" rx="5" width="28" x="64" y="28"/><path d="M67 42 Q78 34 89 42 Q78 50 67 42Z" fill="#F7F3EA"/><circle cx="78" cy="42" fill="#2E9E4F" r="3"/><circle cx="78" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="104" y="49">piabrota</text><text fill="#6B6B6B" font-size="14" x="1068" y="49">github.com/piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="150" letter-spacing="-2" x="57" y="260">PIABROTA</text><text fill="#6B6B6B" font-size="18" x="64" y="304">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="64" x2="1216" y1="340" y2="340"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="390">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="390">mu</text><text fill="#6B6B6B" font-size="15" x="144" y="420">The company chart: the dogma, the standards, the journal and the index of the org's</text><text fill="#6B6B6B" font-size="15" x="144" y="442">repositories.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="390">github.com/piabrota/mu</text><text fill="#6B6B6B" font-size="13" x="916" y="414">no site yet · CC BY 4.0, AGPL-3.0, MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="466" y2="466"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="502">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="502">dojo</text><text fill="#6B6B6B" font-size="15" x="144" y="532">The umbrella: every product as a submodule at a pinned commit, the routing table and its</text><text fill="#6B6B6B" font-size="15" x="144" y="554">own tooling. It holds no product code.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="502">github.com/piabrota/dojo</text><text fill="#6B6B6B" font-size="13" x="916" y="526">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="578" y2="578"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="614">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="614">.github</text><text fill="#6B6B6B" font-size="15" x="144" y="644">The org's profile, with the project table, the fabric figure and the funding links.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="614">github.com/piabrota/.github</text><text fill="#6B6B6B" font-size="13" x="916" y="638">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="672" y2="672"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="708">04</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="708">pirsig</text><text fill="#6B6B6B" font-size="15" x="144" y="738">A second brain: PARA and a Zettelkasten slip-box in one place. Desktop app, REST API and</text><text fill="#6B6B6B" font-size="15" x="144" y="760">the psg CLI.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="708">piabrota.art/pirsig</text><text fill="#A86B00" font-size="13" x="916" y="732">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="784" y2="784"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="820">05</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="820">gramatico</text><text fill="#6B6B6B" font-size="15" x="144" y="850">Rewrites technical text in Brazilian Portuguese so that it reads once. A Claude Code</text><text fill="#6B6B6B" font-size="15" x="144" y="872">plugin.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="820">piabrota.github.io/gramatico</text><text fill="#2E7D32" font-size="13" x="916" y="844">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="896" y2="896"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="932">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="932">closed-source</text><text fill="#6B6B6B" font-size="15" x="144" y="962">The god that failed: a book on why closed source failed as a protection, for science</text><text fill="#6B6B6B" font-size="15" x="144" y="984">first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="932">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="13" x="916" y="956">live · CC BY 4.0, AGPL-3.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1008" y2="1008"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1044">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1044">skills</text><text fill="#6B6B6B" font-size="15" x="144" y="1074">A swiss army knife of agent skills.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1044">h0ffmann.github.io/skills</text><text fill="#2E7D32" font-size="13" x="916" y="1068">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1102" y2="1102"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1138">08</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1138">alerts</text><text fill="#6B6B6B" font-size="15" x="144" y="1168">Alerts from official sources only, to Discord and an Atom feed with CAP 1.2. First: floods</text><text fill="#6B6B6B" font-size="15" x="144" y="1190">in the south of Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1138">piabrota.art/alerts</text><text fill="#A86B00" font-size="13" x="916" y="1162">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1214" y2="1214"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1250">09</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1250">rax</text><text fill="#6B6B6B" font-size="15" x="144" y="1280">Rustic Agentic Runtime: a pure-Rust port of AX, the declarative orchestrator for agentic</text><text fill="#6B6B6B" font-size="15" x="144" y="1302">tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1250">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="13" x="916" y="1274">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1326" y2="1326"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1362">10</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1362">agents</text><text fill="#6B6B6B" font-size="15" x="144" y="1392">Small agents that watch nix-os and its VPS, and report on GitHub as piabrota-ops. They</text><text fill="#6B6B6B" font-size="15" x="144" y="1414">open pull requests and never merge.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1362">github.com/piabrota/agents</text><text fill="#6B6B6B" font-size="13" x="916" y="1386">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1438" y2="1438"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1474">11</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1474">nix-os</text><text fill="#6B6B6B" font-size="15" x="144" y="1504">The NixOS configuration of the small VPS that serves piabrota.art. Judged by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1474">piabrota.art/nixos</text><text fill="#2E7D32" font-size="13" x="916" y="1498">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1532" y2="1532"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1568">12</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1568">astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="15" x="144" y="1598">South of Brazil (RS, SC, PR) disaster extension for AstrBot plugin</text><text fill="#6B6B6B" font-size="15" x="144" y="1620">astrbot_plugin_disaster_warning</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1568">h0ffmann/astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="13" x="916" y="1592">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1644" y2="1644"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1680">13</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1680">astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="15" x="144" y="1710">Bathing water quality alerts for the South of Brazil (RS, SC, PR). An extension for</text><text fill="#6B6B6B" font-size="15" x="144" y="1732">astrbot_plugin_disaster_warning.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1680">h0ffmann/astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="13" x="916" y="1704">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1756" y2="1756"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1792">14</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1792">ihero</text><text fill="#6B6B6B" font-size="15" x="144" y="1822">A FOSS music player and game, in Rust. Coming: the repository holds only its licence.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1792">github.com/piabrota/ihero</text><text fill="#A86B00" font-size="13" x="916" y="1816">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1850" y2="1850"/><text fill="#6B6B6B" font-size="15" x="64" y="1900">Each project is its own repository, with its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="64" y="1922">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="64" y="1968">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
