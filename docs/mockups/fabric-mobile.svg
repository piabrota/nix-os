<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4141" viewBox="0 0 390 4141" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup A, fabric: the piabrota.art homepage, 390 px wide">
<title>Mockup A, fabric: the piabrota.art homepage, 390 px wide</title>
<defs><radialGradient id="glow" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#BC2318" stop-opacity="0.28"/><stop offset="1" stop-color="#BC2318" stop-opacity="0"/></radialGradient></defs>
<rect fill="#0B0D12" height="4141" width="390" x="0" y="0"/>
<rect fill="url(#glow)" height="520" width="390" x="0" y="0"/><g><rect fill="#BC2318" height="36" rx="7" width="36" x="20" y="26"/><path d="M24 44 Q38 34 52 44 Q38 54 24 44Z" fill="#F7F3EA"/><circle cx="38" cy="44" fill="#2E9E4F" r="4"/><circle cx="38" cy="44" fill="#0B0D12" r="2"/></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="22" x="70" y="52">piabrota</text><text fill="#9AA3B2" font-size="22" x="348" y="52">≡</text><text fill="#BC2318" font-size="13" font-weight="600" letter-spacing="2" x="20" y="150">OPEN SOFTWARE FABRIC · MADE IN RJ</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="210">Open software,</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="250">made in Rio de</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="290">Janeiro.</text><text fill="#9AA3B2" font-size="16" x="20" y="336">Each project is its own repository, with</text><text fill="#9AA3B2" font-size="16" x="20" y="360">its own README, licence and tests. The</text><text fill="#9AA3B2" font-size="16" x="20" y="384">source is open, and so is the method.</text><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="57" x="20" y="419"/><text fill="#EDEFF3" font-size="13" x="34" y="439">FOSS</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="100" x="89" y="419"/><text fill="#EDEFF3" font-size="13" x="103" y="439">Rust first</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="78" x="201" y="419"/><text fill="#EDEFF3" font-size="13" x="215" y="439">MPL-2.0</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="108" x="20" y="459"/><text fill="#EDEFF3" font-size="13" x="34" y="479">made in Rio</text></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="20" y="569">Projects</text><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="617">THE COMPANY</text><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="639"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="677">mu</text><text fill="#9AA3B2" font-size="12" x="40" y="699">Markdown, Bash · CC BY 4.0, AGPL-3.0, MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="729">The company chart: the dogma, the</text><text fill="#9AA3B2" font-size="14" x="40" y="749">standards, the journal and the index of</text><text fill="#9AA3B2" font-size="14" x="40" y="769">the org's repositories.</text><circle cx="46" cy="823" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="828">github.com/piabrota/mu</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="869"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="907">dojo</text><text fill="#9AA3B2" font-size="12" x="40" y="929">Bash · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="959">The umbrella: every product as a</text><text fill="#9AA3B2" font-size="14" x="40" y="979">submodule at a pinned commit, the routing</text><text fill="#9AA3B2" font-size="14" x="40" y="999">table and its own tooling. It holds no</text><text fill="#9AA3B2" font-size="14" x="40" y="1019">product code.</text><circle cx="46" cy="1053" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1058">github.com/piabrota/dojo</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="1099"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1137">.github</text><text fill="#9AA3B2" font-size="12" x="40" y="1159">Markdown · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1189">The org's profile, with the project</text><text fill="#9AA3B2" font-size="14" x="40" y="1209">table, the fabric figure and the funding</text><text fill="#9AA3B2" font-size="14" x="40" y="1229">links.</text><circle cx="46" cy="1283" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1288">github.com/piabrota/.github</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="1353">THINK AND WRITE</text><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="1375"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1413">pirsig</text><text fill="#9AA3B2" font-size="12" x="40" y="1435">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1465">A second brain: PARA and a Zettelkasten</text><text fill="#9AA3B2" font-size="14" x="40" y="1485">slip-box in one place. Desktop app, REST</text><text fill="#9AA3B2" font-size="14" x="40" y="1505">API and the psg CLI.</text><circle cx="46" cy="1559" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1564">piabrota.art/pirsig</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="1605"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1643">gramatico</text><text fill="#9AA3B2" font-size="12" x="40" y="1665">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1695">Rewrites technical text in Brazilian</text><text fill="#9AA3B2" font-size="14" x="40" y="1715">Portuguese so that it reads once. A</text><text fill="#9AA3B2" font-size="14" x="40" y="1735">Claude Code plugin.</text><circle cx="46" cy="1789" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1794">piabrota.github.io/gramatico</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="1835"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1873">closed-source</text><text fill="#9AA3B2" font-size="12" x="40" y="1895">Markdown, Gleam · CC BY 4.0, AGPL-3.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1925">The god that failed: a book on why closed</text><text fill="#9AA3B2" font-size="14" x="40" y="1945">source failed as a protection, for</text><text fill="#9AA3B2" font-size="14" x="40" y="1965">science first.</text><circle cx="46" cy="2019" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2024">h0ffmann.github.io/closed-source</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="2065"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="2103">skills</text><text fill="#9AA3B2" font-size="12" x="40" y="2125">Gleam · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="2155">A swiss army knife of agent skills.</text><circle cx="46" cy="2249" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2254">h0ffmann.github.io/skills</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="2319">WARN AND HOST</text><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="2341"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="2379">alerts</text><text fill="#9AA3B2" font-size="12" x="40" y="2401">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="2431">Alerts from official sources only, to</text><text fill="#9AA3B2" font-size="14" x="40" y="2451">Discord and an Atom feed with CAP 1.2.</text><text fill="#9AA3B2" font-size="14" x="40" y="2471">First: floods in the south of Brazil.</text><circle cx="46" cy="2525" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2530">piabrota.art/alerts</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="2571"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="2609">rax</text><text fill="#9AA3B2" font-size="12" x="40" y="2631">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="2661">Rustic Agentic Runtime: a pure-Rust port</text><text fill="#9AA3B2" font-size="14" x="40" y="2681">of AX, the declarative orchestrator for</text><text fill="#9AA3B2" font-size="14" x="40" y="2701">agentic tasks.</text><circle cx="46" cy="2755" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2760">github.com/piabrota/rax</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="2801"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="2839">agents</text><text fill="#9AA3B2" font-size="12" x="40" y="2861">Bash · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="2891">Small agents that watch nix-os and its</text><text fill="#9AA3B2" font-size="14" x="40" y="2911">VPS, and report on GitHub as</text><text fill="#9AA3B2" font-size="14" x="40" y="2931">piabrota-ops. They open pull requests and</text><text fill="#9AA3B2" font-size="14" x="40" y="2951">never merge.</text><circle cx="46" cy="2985" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2990">github.com/piabrota/agents</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="3031"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="3069">nix-os</text><text fill="#9AA3B2" font-size="12" x="40" y="3091">Nix · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="3121">The NixOS configuration of the small VPS</text><text fill="#9AA3B2" font-size="14" x="40" y="3141">that serves piabrota.art. Judged by its</text><text fill="#9AA3B2" font-size="14" x="40" y="3161">closure.</text><circle cx="46" cy="3215" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="3220">piabrota.art/nixos</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="3261"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="3299">astrbot_dw_ext_br_south_disaster</text><text fill="#9AA3B2" font-size="12" x="40" y="3321">Python · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="3351">South of Brazil (RS, SC, PR) disaster</text><text fill="#9AA3B2" font-size="14" x="40" y="3371">extension for AstrBot plugin</text><text fill="#9AA3B2" font-size="14" x="40" y="3391">astrbot_plugin_disaster_warning</text><circle cx="46" cy="3445" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="3450">h0ffmann/astrbot_dw_ext_br_south_disaster</text></g><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="3491"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="3529">astrbot_dw_ext_br_south_waterq</text><text fill="#9AA3B2" font-size="12" x="40" y="3551">Python · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="3581">Bathing water quality alerts for the</text><text fill="#9AA3B2" font-size="14" x="40" y="3601">South of Brazil (RS, SC, PR). An</text><text fill="#9AA3B2" font-size="14" x="40" y="3621">extension for</text><text fill="#9AA3B2" font-size="14" x="40" y="3641">astrbot_plugin_disaster_warning.</text><circle cx="46" cy="3675" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="3680">h0ffmann/astrbot_dw_ext_br_south_waterq</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="3745">PLAY</text><g><rect fill="#14171F" height="210" rx="10" stroke="#2A303C" width="350" x="20" y="3767"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="3805">ihero</text><text fill="#9AA3B2" font-size="12" x="40" y="3827">Rust, planned · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="3857">A FOSS music player and game, in Rust.</text><text fill="#9AA3B2" font-size="14" x="40" y="3877">Coming: the repository holds only its</text><text fill="#9AA3B2" font-size="14" x="40" y="3897">licence.</text><circle cx="46" cy="3951" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="3956">github.com/piabrota/ihero</text></g><line stroke="#2A303C" x1="20" x2="370" y1="4041" y2="4041"/><text fill="#9AA3B2" font-size="13" x="20" y="4081">piabrota.art is served by nix-os, from /nix/store.</text><text fill="#9AA3B2" font-size="13" x="20" y="4105">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
