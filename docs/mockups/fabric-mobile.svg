<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2345" viewBox="0 0 390 2345" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup A, fabric: the piabrota.art homepage, 390 px wide">
<title>Mockup A, fabric: the piabrota.art homepage, 390 px wide</title>
<defs><radialGradient id="glow" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#BC2318" stop-opacity="0.28"/><stop offset="1" stop-color="#BC2318" stop-opacity="0"/></radialGradient></defs>
<rect fill="#0B0D12" height="2345" width="390" x="0" y="0"/>
<rect fill="url(#glow)" height="520" width="390" x="0" y="0"/><g><rect fill="#BC2318" height="36" rx="7" width="36" x="20" y="26"/><path d="M24 44 Q38 34 52 44 Q38 54 24 44Z" fill="#F7F3EA"/><circle cx="38" cy="44" fill="#2E9E4F" r="4"/><circle cx="38" cy="44" fill="#0B0D12" r="2"/></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="22" x="70" y="52">piabrota</text><text fill="#9AA3B2" font-size="22" x="348" y="52">≡</text><text fill="#BC2318" font-size="13" font-weight="600" letter-spacing="2" x="20" y="150">OPEN SOFTWARE FABRIC · MADE IN RJ</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="210">Open software,</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="250">made in Rio de</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="36" x="20" y="290">Janeiro.</text><text fill="#9AA3B2" font-size="16" x="20" y="336">Each project is its own repository, with</text><text fill="#9AA3B2" font-size="16" x="20" y="360">its own README, licence and tests. The</text><text fill="#9AA3B2" font-size="16" x="20" y="384">source is open, and so is the method.</text><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="57" x="20" y="419"/><text fill="#EDEFF3" font-size="13" x="34" y="439">FOSS</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="100" x="89" y="419"/><text fill="#EDEFF3" font-size="13" x="103" y="439">Rust first</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="78" x="201" y="419"/><text fill="#EDEFF3" font-size="13" x="215" y="439">MPL-2.0</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="108" x="20" y="459"/><text fill="#EDEFF3" font-size="13" x="34" y="479">made in Rio</text></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="20" y="569">Projects</text><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="617">THINK AND WRITE</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="639"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="677">pirsig</text><text fill="#9AA3B2" font-size="12" x="40" y="699">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="729">A second brain: PARA and a Zettelkasten</text><text fill="#9AA3B2" font-size="14" x="40" y="749">slip-box in one place. Desktop app, REST</text><text fill="#9AA3B2" font-size="14" x="40" y="769">API and the psg CLI.</text><circle cx="46" cy="803" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="808">piabrota.art/pirsig</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="887">gramatico</text><text fill="#9AA3B2" font-size="12" x="40" y="909">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="939">Rewrites technical text in Brazilian</text><text fill="#9AA3B2" font-size="14" x="40" y="959">Portuguese so that it reads once. A</text><text fill="#9AA3B2" font-size="14" x="40" y="979">Claude Code plugin.</text><circle cx="46" cy="1013" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1018">piabrota.github.io/gramatico</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="1059"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1097">closed-source</text><text fill="#9AA3B2" font-size="12" x="40" y="1119">Markdown · CC BY 4.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1149">The god that failed: a book on why closed</text><text fill="#9AA3B2" font-size="14" x="40" y="1169">source failed as a protection, for</text><text fill="#9AA3B2" font-size="14" x="40" y="1189">science first.</text><circle cx="46" cy="1223" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1228">h0ffmann.github.io/closed-source</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="1293">WARN AND HOST</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="1315"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1353">alerts</text><text fill="#9AA3B2" font-size="12" x="40" y="1375">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1405">Alerts from official sources only, to</text><text fill="#9AA3B2" font-size="14" x="40" y="1425">Discord and an Atom feed with CAP 1.2.</text><text fill="#9AA3B2" font-size="14" x="40" y="1445">First: floods in the south of Brazil.</text><circle cx="46" cy="1479" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1484">piabrota.art/alerts</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="1525"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1563">rax</text><text fill="#9AA3B2" font-size="12" x="40" y="1585">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1615">Rustic Agentic Runtime: a pure-Rust port</text><text fill="#9AA3B2" font-size="14" x="40" y="1635">of AX, the declarative orchestrator for</text><text fill="#9AA3B2" font-size="14" x="40" y="1655">agentic tasks.</text><circle cx="46" cy="1689" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1694">github.com/piabrota/rax</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="1735"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="1773">nix-os</text><text fill="#9AA3B2" font-size="12" x="40" y="1795">Nix · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="1825">The NixOS configuration of the small VPS</text><text fill="#9AA3B2" font-size="14" x="40" y="1845">that serves piabrota.art. Judged by its</text><text fill="#9AA3B2" font-size="14" x="40" y="1865">closure.</text><circle cx="46" cy="1899" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="1904">piabrota.art/nixos</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="20" y="1969">PLAY</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="350" x="20" y="1991"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="40" y="2029">ihero</text><text fill="#9AA3B2" font-size="12" x="40" y="2051">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="40" y="2081">A FOSS music player and game, in Rust.</text><text fill="#9AA3B2" font-size="14" x="40" y="2101">Coming.</text><circle cx="46" cy="2155" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="60" y="2160">no repository yet</text></g><line stroke="#2A303C" x1="20" x2="370" y1="2245" y2="2245"/><text fill="#9AA3B2" font-size="13" x="20" y="2285">piabrota.art is served by nix-os, from /nix/store.</text><text fill="#9AA3B2" font-size="13" x="20" y="2309">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
