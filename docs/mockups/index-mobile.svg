<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3264" viewBox="0 0 390 3264" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup B, index: the piabrota.art homepage, 390 px wide">
<title>Mockup B, index: the piabrota.art homepage, 390 px wide</title>
<defs></defs>
<rect fill="#FAFAF7" height="3264" width="390" x="0" y="0"/>
<g><rect fill="#BC2318" height="28" rx="5" width="28" x="20" y="28"/><path d="M23 42 Q34 34 45 42 Q34 50 23 42Z" fill="#F7F3EA"/><circle cx="34" cy="42" fill="#2E9E4F" r="3"/><circle cx="34" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="60" y="49">piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="64" letter-spacing="-2" x="17" y="174">PIABROTA</text><text fill="#6B6B6B" font-size="15" x="20" y="218">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="20" x2="370" y1="254" y2="254"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="304">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="304">mu</text><text fill="#6B6B6B" font-size="15" x="64" y="334">The company chart: the dogma, the</text><text fill="#6B6B6B" font-size="15" x="64" y="356">standards, the journal and the index</text><text fill="#6B6B6B" font-size="15" x="64" y="378">of the org's repositories.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="406">github.com/piabrota/mu</text><text fill="#6B6B6B" font-size="12" x="64" y="428">no site yet · CC BY 4.0, AGPL-3.0, MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="464" y2="464"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="500">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="500">dojo</text><text fill="#6B6B6B" font-size="15" x="64" y="530">The umbrella: every product as a</text><text fill="#6B6B6B" font-size="15" x="64" y="552">submodule at a pinned commit, the</text><text fill="#6B6B6B" font-size="15" x="64" y="574">routing table and its own tooling. It</text><text fill="#6B6B6B" font-size="15" x="64" y="596">holds no product code.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="624">github.com/piabrota/dojo</text><text fill="#6B6B6B" font-size="12" x="64" y="646">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="682" y2="682"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="718">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="718">.github</text><text fill="#6B6B6B" font-size="15" x="64" y="748">The org's profile, with the project</text><text fill="#6B6B6B" font-size="15" x="64" y="770">table, the fabric figure and the</text><text fill="#6B6B6B" font-size="15" x="64" y="792">funding links.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="820">github.com/piabrota/.github</text><text fill="#6B6B6B" font-size="12" x="64" y="842">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="878" y2="878"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="914">04</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="914">pirsig</text><text fill="#6B6B6B" font-size="15" x="64" y="944">A second brain: PARA and a</text><text fill="#6B6B6B" font-size="15" x="64" y="966">Zettelkasten slip-box in one place.</text><text fill="#6B6B6B" font-size="15" x="64" y="988">Desktop app, REST API and the psg</text><text fill="#6B6B6B" font-size="15" x="64" y="1010">CLI.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1038">piabrota.art/pirsig</text><text fill="#A86B00" font-size="12" x="64" y="1060">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1096" y2="1096"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1132">05</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1132">gramatico</text><text fill="#6B6B6B" font-size="15" x="64" y="1162">Rewrites technical text in Brazilian</text><text fill="#6B6B6B" font-size="15" x="64" y="1184">Portuguese so that it reads once. A</text><text fill="#6B6B6B" font-size="15" x="64" y="1206">Claude Code plugin.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1234">piabrota.github.io/gramatico</text><text fill="#2E7D32" font-size="12" x="64" y="1256">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1292" y2="1292"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1328">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1328">closed-source</text><text fill="#6B6B6B" font-size="15" x="64" y="1358">The god that failed: a book on why</text><text fill="#6B6B6B" font-size="15" x="64" y="1380">closed source failed as a protection,</text><text fill="#6B6B6B" font-size="15" x="64" y="1402">for science first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1430">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="12" x="64" y="1452">live · CC BY 4.0, AGPL-3.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1488" y2="1488"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1524">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1524">skills</text><text fill="#6B6B6B" font-size="15" x="64" y="1554">A swiss army knife of agent skills.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1582">h0ffmann.github.io/skills</text><text fill="#2E7D32" font-size="12" x="64" y="1604">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1640" y2="1640"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1676">08</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1676">alerts</text><text fill="#6B6B6B" font-size="15" x="64" y="1706">Alerts from official sources only, to</text><text fill="#6B6B6B" font-size="15" x="64" y="1728">Discord and an Atom feed with CAP</text><text fill="#6B6B6B" font-size="15" x="64" y="1750">1.2. First: floods in the south of</text><text fill="#6B6B6B" font-size="15" x="64" y="1772">Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1800">piabrota.art/alerts</text><text fill="#A86B00" font-size="12" x="64" y="1822">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1858" y2="1858"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1894">09</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1894">rax</text><text fill="#6B6B6B" font-size="15" x="64" y="1924">Rustic Agentic Runtime: a pure-Rust</text><text fill="#6B6B6B" font-size="15" x="64" y="1946">port of AX, the declarative</text><text fill="#6B6B6B" font-size="15" x="64" y="1968">orchestrator for agentic tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1996">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="12" x="64" y="2018">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2054" y2="2054"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2090">10</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2090">agents</text><text fill="#6B6B6B" font-size="15" x="64" y="2120">Small agents that watch nix-os and</text><text fill="#6B6B6B" font-size="15" x="64" y="2142">its VPS, and report on GitHub as</text><text fill="#6B6B6B" font-size="15" x="64" y="2164">piabrota-ops. They open pull requests</text><text fill="#6B6B6B" font-size="15" x="64" y="2186">and never merge.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2214">github.com/piabrota/agents</text><text fill="#6B6B6B" font-size="12" x="64" y="2236">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2272" y2="2272"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2308">11</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2308">nix-os</text><text fill="#6B6B6B" font-size="15" x="64" y="2338">The NixOS configuration of the small</text><text fill="#6B6B6B" font-size="15" x="64" y="2360">VPS that serves piabrota.art. Judged</text><text fill="#6B6B6B" font-size="15" x="64" y="2382">by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2410">piabrota.art/nixos</text><text fill="#2E7D32" font-size="12" x="64" y="2432">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2468" y2="2468"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2504">12</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2504">astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="15" x="64" y="2534">South of Brazil (RS, SC, PR) disaster</text><text fill="#6B6B6B" font-size="15" x="64" y="2556">extension for AstrBot plugin</text><text fill="#6B6B6B" font-size="15" x="64" y="2578">astrbot_plugin_disaster_warning</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2606">h0ffmann/astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="12" x="64" y="2628">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2664" y2="2664"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2700">13</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2700">astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="15" x="64" y="2730">Bathing water quality alerts for the</text><text fill="#6B6B6B" font-size="15" x="64" y="2752">South of Brazil (RS, SC, PR). An</text><text fill="#6B6B6B" font-size="15" x="64" y="2774">extension for</text><text fill="#6B6B6B" font-size="15" x="64" y="2796">astrbot_plugin_disaster_warning.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2824">h0ffmann/astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="12" x="64" y="2846">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2882" y2="2882"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2918">14</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2918">ihero</text><text fill="#6B6B6B" font-size="15" x="64" y="2948">A FOSS music player and game, in</text><text fill="#6B6B6B" font-size="15" x="64" y="2970">Rust. Coming: the repository holds</text><text fill="#6B6B6B" font-size="15" x="64" y="2992">only its licence.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3020">github.com/piabrota/ihero</text><text fill="#A86B00" font-size="12" x="64" y="3042">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3078" y2="3078"/><text fill="#6B6B6B" font-size="15" x="20" y="3128">Each project is its own repository, with</text><text fill="#6B6B6B" font-size="15" x="20" y="3150">its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="20" y="3172">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="20" y="3218">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
