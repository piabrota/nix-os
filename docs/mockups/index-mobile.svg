<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4158" viewBox="0 0 390 4158" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup B, index: the piabrota.art homepage, 390 px wide">
<title>Mockup B, index: the piabrota.art homepage, 390 px wide</title>
<defs></defs>
<rect fill="#FAFAF7" height="4158" width="390" x="0" y="0"/>
<g><rect fill="#BC2318" height="28" rx="5" width="28" x="20" y="28"/><path d="M23 42 Q34 34 45 42 Q34 50 23 42Z" fill="#F7F3EA"/><circle cx="34" cy="42" fill="#2E9E4F" r="3"/><circle cx="34" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="60" y="49">piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="64" letter-spacing="-2" x="17" y="174">PIABROTA</text><text fill="#6B6B6B" font-size="15" x="20" y="218">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="20" x2="370" y1="254" y2="254"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="304">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="304">mu</text><text fill="#6B6B6B" font-size="15" x="64" y="334">The company chart: the dogma, the</text><text fill="#6B6B6B" font-size="15" x="64" y="356">standards, the journal and the index</text><text fill="#6B6B6B" font-size="15" x="64" y="378">of the org's repositories.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="406">github.com/piabrota/mu</text><text fill="#6B6B6B" font-size="12" x="64" y="428">no site yet · CC BY 4.0, AGPL-3.0, MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="464" y2="464"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="500">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="500">dojo</text><text fill="#6B6B6B" font-size="15" x="64" y="530">The umbrella: every product as a</text><text fill="#6B6B6B" font-size="15" x="64" y="552">submodule at a pinned commit, the</text><text fill="#6B6B6B" font-size="15" x="64" y="574">routing table and its own tooling. It</text><text fill="#6B6B6B" font-size="15" x="64" y="596">holds no product code.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="624">github.com/piabrota/dojo</text><text fill="#6B6B6B" font-size="12" x="64" y="646">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="682" y2="682"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="718">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="718">.github</text><text fill="#6B6B6B" font-size="15" x="64" y="748">The org's profile, with the project</text><text fill="#6B6B6B" font-size="15" x="64" y="770">table, the fabric figure and the</text><text fill="#6B6B6B" font-size="15" x="64" y="792">funding links.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="820">github.com/piabrota/.github</text><text fill="#6B6B6B" font-size="12" x="64" y="842">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="878" y2="878"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="914">04</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="914">pirsig</text><text fill="#6B6B6B" font-size="15" x="64" y="944">A second brain: PARA and a</text><text fill="#6B6B6B" font-size="15" x="64" y="966">Zettelkasten slip-box in one place.</text><text fill="#6B6B6B" font-size="15" x="64" y="988">Desktop app, REST API and the psg</text><text fill="#6B6B6B" font-size="15" x="64" y="1010">CLI.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1038">piabrota.art/pirsig</text><text fill="#A86B00" font-size="12" x="64" y="1060">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1096" y2="1096"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1132">05</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1132">gramatico</text><text fill="#6B6B6B" font-size="15" x="64" y="1162">Rewrites technical text in Brazilian</text><text fill="#6B6B6B" font-size="15" x="64" y="1184">Portuguese so that it reads once. A</text><text fill="#6B6B6B" font-size="15" x="64" y="1206">Claude Code plugin.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1234">piabrota.github.io/gramatico</text><text fill="#2E7D32" font-size="12" x="64" y="1256">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1292" y2="1292"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1328">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1328">closed-source</text><text fill="#6B6B6B" font-size="15" x="64" y="1358">The god that failed: a book on why</text><text fill="#6B6B6B" font-size="15" x="64" y="1380">closed source failed as a protection,</text><text fill="#6B6B6B" font-size="15" x="64" y="1402">for science first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1430">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="12" x="64" y="1452">live · CC BY 4.0, AGPL-3.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1488" y2="1488"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1524">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1524">skills</text><text fill="#6B6B6B" font-size="15" x="64" y="1554">A swiss army knife of agent skills.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1582">piabrota.art/skills/</text><text fill="#2E7D32" font-size="12" x="64" y="1604">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1640" y2="1640"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1676">08</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1676">hermes</text><text fill="#6B6B6B" font-size="15" x="64" y="1706">Nous Research's Hermes Agent on the</text><text fill="#6B6B6B" font-size="15" x="64" y="1728">VPS, with Claude on Telegram and</text><text fill="#6B6B6B" font-size="15" x="64" y="1750">Discord. Its configuration, as plain</text><text fill="#6B6B6B" font-size="15" x="64" y="1772">YAML.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1800">piabrota.art/hermes</text><text fill="#2E7D32" font-size="12" x="64" y="1822">live · MIT, MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1858" y2="1858"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1894">09</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1894">awesome-neurosymbolic-ai</text><text fill="#6B6B6B" font-size="15" x="64" y="1924">A curated list of frameworks,</text><text fill="#6B6B6B" font-size="15" x="64" y="1946">reasoners, papers, courses and</text><text fill="#6B6B6B" font-size="15" x="64" y="1968">benchmarks for neurosymbolic AI:</text><text fill="#6B6B6B" font-size="15" x="64" y="1990">neural learning with symbolic</text><text fill="#6B6B6B" font-size="15" x="64" y="2012">reasoning.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2040">h0ffmann/awesome-neurosymbolic-ai</text><text fill="#6B6B6B" font-size="12" x="64" y="2062">no site yet · CC0-1.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2098" y2="2098"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2134">10</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2134">alerts</text><text fill="#6B6B6B" font-size="15" x="64" y="2164">Alerts from official sources only, to</text><text fill="#6B6B6B" font-size="15" x="64" y="2186">Discord and an Atom feed with CAP</text><text fill="#6B6B6B" font-size="15" x="64" y="2208">1.2. First: floods in the south of</text><text fill="#6B6B6B" font-size="15" x="64" y="2230">Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2258">piabrota.art/alerts</text><text fill="#A86B00" font-size="12" x="64" y="2280">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2316" y2="2316"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2352">11</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2352">rax</text><text fill="#6B6B6B" font-size="15" x="64" y="2382">Rustic Agentic Runtime: a pure-Rust</text><text fill="#6B6B6B" font-size="15" x="64" y="2404">port of AX, the declarative</text><text fill="#6B6B6B" font-size="15" x="64" y="2426">orchestrator for agentic tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2454">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="12" x="64" y="2476">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2512" y2="2512"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2548">12</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2548">agents</text><text fill="#6B6B6B" font-size="15" x="64" y="2578">Small agents that watch nix-os and</text><text fill="#6B6B6B" font-size="15" x="64" y="2600">its VPS, and report on GitHub as</text><text fill="#6B6B6B" font-size="15" x="64" y="2622">piabrota-ops. They open pull requests</text><text fill="#6B6B6B" font-size="15" x="64" y="2644">and never merge.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2672">github.com/piabrota/agents</text><text fill="#6B6B6B" font-size="12" x="64" y="2694">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2730" y2="2730"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2766">13</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2766">nix-os</text><text fill="#6B6B6B" font-size="15" x="64" y="2796">The NixOS configuration of the small</text><text fill="#6B6B6B" font-size="15" x="64" y="2818">VPS that serves piabrota.art. Judged</text><text fill="#6B6B6B" font-size="15" x="64" y="2840">by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="2868">piabrota.art/nixos</text><text fill="#2E7D32" font-size="12" x="64" y="2890">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="2926" y2="2926"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="2962">14</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="2962">astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="15" x="64" y="2992">South of Brazil (RS, SC, PR) disaster</text><text fill="#6B6B6B" font-size="15" x="64" y="3014">extension for AstrBot plugin</text><text fill="#6B6B6B" font-size="15" x="64" y="3036">astrbot_plugin_disaster_warning</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3064">h0ffmann/astrbot_dw_ext_br_south_disaster</text><text fill="#6B6B6B" font-size="12" x="64" y="3086">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3122" y2="3122"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="3158">15</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="3158">astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="15" x="64" y="3188">Bathing water quality alerts for the</text><text fill="#6B6B6B" font-size="15" x="64" y="3210">South of Brazil (RS, SC, PR). An</text><text fill="#6B6B6B" font-size="15" x="64" y="3232">extension for</text><text fill="#6B6B6B" font-size="15" x="64" y="3254">astrbot_plugin_disaster_warning.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3282">h0ffmann/astrbot_dw_ext_br_south_waterq</text><text fill="#6B6B6B" font-size="12" x="64" y="3304">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3340" y2="3340"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="3376">16</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="3376">ihero</text><text fill="#6B6B6B" font-size="15" x="64" y="3406">A FOSS music player and game, in</text><text fill="#6B6B6B" font-size="15" x="64" y="3428">Rust. Coming: the repository holds</text><text fill="#6B6B6B" font-size="15" x="64" y="3450">only its licence.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3478">github.com/piabrota/ihero</text><text fill="#A86B00" font-size="12" x="64" y="3500">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3536" y2="3536"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="3572">17</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="3572">ondecomer</text><text fill="#6B6B6B" font-size="15" x="64" y="3602">A site that lists the restaurants of</text><text fill="#6B6B6B" font-size="15" x="64" y="3624">Brazil, with filters for category,</text><text fill="#6B6B6B" font-size="15" x="64" y="3646">location and more. For now it covers</text><text fill="#6B6B6B" font-size="15" x="64" y="3668">only the city of Rio de Janeiro.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3696">aracyla.github.io/onde-comer</text><text fill="#2E7D32" font-size="12" x="64" y="3718">live · Apache-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3754" y2="3754"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="3790">18</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="3790">proof</text><text fill="#6B6B6B" font-size="15" x="64" y="3820">Specifications written and proved in</text><text fill="#6B6B6B" font-size="15" x="64" y="3842">Lean 4, with Haskell and Rust</text><text fill="#6B6B6B" font-size="15" x="64" y="3864">implementations checked against them,</text><text fill="#6B6B6B" font-size="15" x="64" y="3886">and data experiments with papers.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="3914">h0ffmann/proof</text><text fill="#6B6B6B" font-size="12" x="64" y="3936">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="3972" y2="3972"/><text fill="#6B6B6B" font-size="15" x="20" y="4022">Each project is its own repository, with</text><text fill="#6B6B6B" font-size="15" x="20" y="4044">its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="20" y="4066">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="20" y="4112">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
