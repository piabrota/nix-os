<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2135" viewBox="0 0 1280 2135" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup A, fabric: the piabrota.art homepage, 1280 px wide">
<title>Mockup A, fabric: the piabrota.art homepage, 1280 px wide</title>
<defs><radialGradient id="glow" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#BC2318" stop-opacity="0.28"/><stop offset="1" stop-color="#BC2318" stop-opacity="0"/></radialGradient></defs>
<rect fill="#0B0D12" height="2135" width="1280" x="0" y="0"/>
<rect fill="url(#glow)" height="520" width="1280" x="0" y="0"/><g><rect fill="#BC2318" height="36" rx="7" width="36" x="64" y="26"/><path d="M68 44 Q82 34 96 44 Q82 54 68 44Z" fill="#F7F3EA"/><circle cx="82" cy="44" fill="#2E9E4F" r="4"/><circle cx="82" cy="44" fill="#0B0D12" r="2"/></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="22" x="114" y="52">piabrota</text><text fill="#9AA3B2" font-size="15" x="828" y="52">structure</text><text fill="#9AA3B2" font-size="15" x="931" y="52">dogma</text><text fill="#9AA3B2" font-size="15" x="1001" y="52">inventory</text><text fill="#9AA3B2" font-size="15" x="1104" y="52">board</text><text fill="#9AA3B2" font-size="15" x="1174" y="52">forks</text><text fill="#BC2318" font-size="13" font-weight="600" letter-spacing="2" x="64" y="150">OPEN SOFTWARE FABRIC · MADE IN RJ</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="60" x="64" y="234">Open software, made in</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="60" x="64" y="301">Rio de Janeiro.</text><text fill="#9AA3B2" font-size="19" x="64" y="350">Each project is its own repository, with its own README, licence</text><text fill="#9AA3B2" font-size="19" x="64" y="379">and tests. The source is open, and so is the method.</text><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="57" x="64" y="413"/><text fill="#EDEFF3" font-size="13" x="78" y="433">FOSS</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="100" x="133" y="413"/><text fill="#EDEFF3" font-size="13" x="147" y="433">Rust first</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="78" x="245" y="413"/><text fill="#EDEFF3" font-size="13" x="259" y="433">MPL-2.0</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="108" x="335" y="413"/><text fill="#EDEFF3" font-size="13" x="349" y="433">made in Rio</text></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="64" y="523">Projects</text><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="571">THE COMPANY</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="631">mu</text><text fill="#9AA3B2" font-size="12" x="84" y="653">Markdown, Bash · CC BY 4.0, AGPL-3.0, MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="683">The company chart: the dogma, the</text><text fill="#9AA3B2" font-size="14" x="84" y="703">standards, the journal and the index of the</text><text fill="#9AA3B2" font-size="14" x="84" y="723">org's repositories.</text><circle cx="90" cy="757" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="762">github.com/piabrota/mu</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="631">dojo</text><text fill="#9AA3B2" font-size="12" x="474" y="653">Bash · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="683">The umbrella: every product as a submodule</text><text fill="#9AA3B2" font-size="14" x="474" y="703">at a pinned commit, the routing table and</text><text fill="#9AA3B2" font-size="14" x="474" y="723">its own tooling. It holds no product code.</text><circle cx="480" cy="757" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="762">github.com/piabrota/dojo</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="631">.github</text><text fill="#9AA3B2" font-size="12" x="864" y="653">Markdown · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="864" y="683">The org's profile, with the project table,</text><text fill="#9AA3B2" font-size="14" x="864" y="703">the fabric figure and the funding links.</text><circle cx="870" cy="757" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="762">github.com/piabrota/.github</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="827">THINK AND WRITE</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="887">pirsig</text><text fill="#9AA3B2" font-size="12" x="84" y="909">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="939">A second brain: PARA and a Zettelkasten</text><text fill="#9AA3B2" font-size="14" x="84" y="959">slip-box in one place. Desktop app, REST</text><text fill="#9AA3B2" font-size="14" x="84" y="979">API and the psg CLI.</text><circle cx="90" cy="1013" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1018">piabrota.art/pirsig</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="887">gramatico</text><text fill="#9AA3B2" font-size="12" x="474" y="909">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="939">Rewrites technical text in Brazilian</text><text fill="#9AA3B2" font-size="14" x="474" y="959">Portuguese so that it reads once. A Claude</text><text fill="#9AA3B2" font-size="14" x="474" y="979">Code plugin.</text><circle cx="480" cy="1013" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="1018">piabrota.github.io/gramatico</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="887">closed-source</text><text fill="#9AA3B2" font-size="12" x="864" y="909">Markdown, Gleam · CC BY 4.0, AGPL-3.0</text><text fill="#9AA3B2" font-size="14" x="864" y="939">The god that failed: a book on why closed</text><text fill="#9AA3B2" font-size="14" x="864" y="959">source failed as a protection, for science</text><text fill="#9AA3B2" font-size="14" x="864" y="979">first.</text><circle cx="870" cy="1013" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="1018">h0ffmann.github.io/closed-source</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="1059"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="1097">skills</text><text fill="#9AA3B2" font-size="12" x="84" y="1119">Gleam · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="1149">A swiss army knife of agent skills.</text><circle cx="90" cy="1223" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1228">h0ffmann.github.io/skills</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="1293">WARN AND HOST</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="1315"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="1353">alerts</text><text fill="#9AA3B2" font-size="12" x="84" y="1375">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="1405">Alerts from official sources only, to</text><text fill="#9AA3B2" font-size="14" x="84" y="1425">Discord and an Atom feed with CAP 1.2.</text><text fill="#9AA3B2" font-size="14" x="84" y="1445">First: floods in the south of Brazil.</text><circle cx="90" cy="1479" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1484">piabrota.art/alerts</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="1315"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="1353">rax</text><text fill="#9AA3B2" font-size="12" x="474" y="1375">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="1405">Rustic Agentic Runtime: a pure-Rust port of</text><text fill="#9AA3B2" font-size="14" x="474" y="1425">AX, the declarative orchestrator for</text><text fill="#9AA3B2" font-size="14" x="474" y="1445">agentic tasks.</text><circle cx="480" cy="1479" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="1484">github.com/piabrota/rax</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="1315"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="1353">agents</text><text fill="#9AA3B2" font-size="12" x="864" y="1375">Bash · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="864" y="1405">Small agents that watch nix-os and its VPS,</text><text fill="#9AA3B2" font-size="14" x="864" y="1425">and report on GitHub as piabrota-ops. They</text><text fill="#9AA3B2" font-size="14" x="864" y="1445">open pull requests and never merge.</text><circle cx="870" cy="1479" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="1484">github.com/piabrota/agents</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="1525"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="1563">nix-os</text><text fill="#9AA3B2" font-size="12" x="84" y="1585">Nix · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="1615">The NixOS configuration of the small VPS</text><text fill="#9AA3B2" font-size="14" x="84" y="1635">that serves piabrota.art. Judged by its</text><text fill="#9AA3B2" font-size="14" x="84" y="1655">closure.</text><circle cx="90" cy="1689" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1694">piabrota.art/nixos</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="1525"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="1563">astrbot_dw_ext_br_south_disaster</text><text fill="#9AA3B2" font-size="12" x="474" y="1585">Python · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="1615">South of Brazil (RS, SC, PR) disaster</text><text fill="#9AA3B2" font-size="14" x="474" y="1635">extension for AstrBot plugin</text><text fill="#9AA3B2" font-size="14" x="474" y="1655">astrbot_plugin_disaster_warning</text><circle cx="480" cy="1689" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="1694">h0ffmann/astrbot_dw_ext_br_south_disaster</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="1525"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="1563">astrbot_dw_ext_br_south_waterq</text><text fill="#9AA3B2" font-size="12" x="864" y="1585">Python · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="864" y="1615">Bathing water quality alerts for the South</text><text fill="#9AA3B2" font-size="14" x="864" y="1635">of Brazil (RS, SC, PR). An extension for</text><text fill="#9AA3B2" font-size="14" x="864" y="1655">astrbot_plugin_disaster_warning.</text><circle cx="870" cy="1689" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="1694">h0ffmann/astrbot_dw_ext_br_south_waterq</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="1759">PLAY</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="1781"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="1819">ihero</text><text fill="#9AA3B2" font-size="12" x="84" y="1841">Rust, planned · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="1871">A FOSS music player and game, in Rust.</text><text fill="#9AA3B2" font-size="14" x="84" y="1891">Coming: the repository holds only its</text><text fill="#9AA3B2" font-size="14" x="84" y="1911">licence.</text><circle cx="90" cy="1945" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1950">github.com/piabrota/ihero</text></g><line stroke="#2A303C" x1="64" x2="1216" y1="2035" y2="2035"/><text fill="#9AA3B2" font-size="13" x="64" y="2075">piabrota.art is served by nix-os, from /nix/store.</text><text fill="#9AA3B2" font-size="13" x="64" y="2099">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
