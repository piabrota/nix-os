[package]
name = "lofi"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[dependencies]
# Only what a gateway bot that sends voice needs: no cache, no framework, no message content.
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "voice"] }
# 0.6 is the first release with DAVE, Discord's end-to-end encryption, mandatory for voice since 2026.
songbird = { version = "0.6.1", features = ["builtin-queue"] }
# songbird asks Symphonia for no codec: the defaults give Ogg, Vorbis, FLAC and WAV, plus MP3 here.
symphonia = { version = "0.5.2", features = ["mp3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
fastrand = "2"

# Size over speed: the hot path (Opus) is libopus, in C. 11 MiB stripped, against 20 MiB
# with thin LTO at the default level.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
