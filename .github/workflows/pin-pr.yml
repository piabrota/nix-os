# Temporary, for one pin PR: runs `pins one marola-site` (nix) where this agent has no nix, and
# uploads the diff as a patch. Runs on a push of this side branch; the PR branch carries no
# workflow. The marola-site package is a GHC build: the heavy step of this job.
name: Pin marola-site for the PR's patch

on:
  push:
    branches: [claude/nix-os-marola-site-pin-render]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: pins one marola-site
        run: nix run .#piabrota -- pins one marola-site
      - name: the diff
        run: |
          git diff > pin-marola-site.patch
          cat pin-marola-site.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-marola-site
          path: pin-marola-site.patch
