name: cves

# A report, not a gate: vulnix matches package names and versions against the NVD, so it also
# lists CVEs that nixpkgs has patched or that belong to another program with the same name.
# Read the summary of the run; a whitelist (vulnix --whitelist) can come later.
on:
  # After a merge, not on pull requests: a report a PR cannot act on only slows its checks down.
  # A change to Markdown only builds nothing: it cannot change the system.
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnix:
    name: vulnix on the system closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same space as deploy.yml's build: the closure with omp and Hermes does not fit in the
      # runner's 14 GB ("No space left on device" on 2026-11-03).
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: cachix/install-nix-action@v31
      # Restore only: the newest store of deploy or ci, so the report does not compile what a deploy
      # already built. It saves nothing, so it takes no space in the Actions cache quota.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deploy-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - run: nix build .#nixosConfigurations.piabrota.config.system.build.toplevel --no-update-lock-file
      - name: vulnix (exit 2 means it found something; that is the report)
        run: |
          status=0
          nix run --inputs-from . nixpkgs#vulnix -- --closure ./result > vulnix.txt || status=$?
          {
            echo '### vulnix on `'"$(readlink result)"'`'
            echo '```'
            cat vulnix.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat vulnix.txt
          [ "$status" -le 2 ]
