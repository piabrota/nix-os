name: ci

on:
  # A change to Markdown only builds nothing: it cannot change the system.
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action deletes this workflow's older caches.
  actions: write

jobs:
  flake:
    name: flake check (builds the system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The runner starts with an empty /nix/store and cache.nixos.org has nothing built here, so
      # without this every run compiles apps/notes (about 400 crates) again. The store is saved to GitHub's
      # Actions cache after a successful run and restored at the start of the next: the newest cache
      # of ci or deploy on this branch, else main's (a PR reads main's caches, not the reverse). Older
      # caches of this workflow and branch are deleted after the save, to stay in the 10 GB quota.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('flake.lock', '**/*.nix', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-ci-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --no-update-lock-file --print-build-logs
      - run: nix run nixpkgs#nixpkgs-fmt -- --check flake.nix deploy.nix tools.nix loco.nix site.nix kubesolo.nix kubesolo/package.nix pgx.nix pgx/package.nix pgx/test.nix site/default.nix site/data.nix apps.nix apps/notes/default.nix drawings/*.nix mockups/*.nix
      - run: nix run nixpkgs#statix -- check .
      - run: nix run nixpkgs#deadnix -- --fail .
      - run: nix run nixpkgs#shellcheck -- scripts/*.sh kubesolo/k8s.bash
      - name: DeepWiki's page plan is within its limits (.devin/wiki.json)
        run: nix run nixpkgs#jq -- -r -f scripts/deepwiki-check.jq .devin/wiki.json
      - name: figures match their sources (offline; the pin is read from the index)
        run: nix shell nixpkgs#just -c just figure-check

  justfiles:
    # Project rule: every justfile runs on the just that Ubuntu LTS ships through apt
    # (1.21.0 on 24.04). Do not move this job to a newer Ubuntu while 24.04 is supported.
    name: justfiles parse with Ubuntu's just
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: just --version
      - name: parse every justfile
        run: |
          status=0
          for f in $(git ls-files 'justfile' '*/justfile' 'Justfile' '*/Justfile' '*.just'); do
            echo "::group::$f"
            just --justfile "$f" --working-directory "$(dirname "$f")" --summary || status=1
            echo "::endgroup::"
          done
          exit $status
