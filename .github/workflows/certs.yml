name: certs

# The HTTPS certificate of every live name in scripts/domains.txt, from outside, as a browser sees
# it (piabrota cert-check, scala/scripts/CertCheck.scala). A red run means a name shows a browser warning, answers no TLS, or
# expires within 14 days; GitHub mails the owner. It changes nothing on the boxes: a failed ACME
# order retries by itself every 20 minutes (acme-retry.nix); docs/SITE.md, "Certificates".
on:
  schedule:
    - cron: "17 */6 * * *"
  # After each deploy: a new vhost's first order runs on the switch.
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: certificates of the live names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Give a new order time to finish after a deploy
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: Check every name
        run: |
          set -o pipefail
          nix run .#piabrota -- cert-check | tee -a "$GITHUB_STEP_SUMMARY"
