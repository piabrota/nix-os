name: deploy

# Every push to main is deployed to the VPS. The runner builds the system, deploy-rs copies
# it over SSH (the box pulls what cache.nixos.org has) and activates it. If the box cannot
# be reached over SSH after the switch, deploy-rs rolls it back.
on:
  push:
    branches: [main]
    # A merge that changes only Markdown leaves the system as it is: nothing to deploy. k8s/ holds
    # workloads for KubeSolo, applied over an SSH tunnel, never by a system deploy (docs/KUBESOLO.md).
    paths-ignore: ['**.md', 'k8s/**']
  workflow_dispatch:
    inputs:
      ssh_user:
        # `h0ffmann` only for the first deploy, before the `deploy` user exists (docs/DEPLOY.md).
        description: SSH user
        type: choice
        options: [deploy, h0ffmann]
        default: deploy

permissions:
  contents: read
  # cache-nix-action deletes this workflow's older caches.
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Built in its own job, without the prod environment: the build never sees the deploy key, and a
  # deploy that fails to reach the VPS (an SSH timeout) is retried with "Re-run failed jobs",
  # without building again.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The runner starts with an empty /nix/store and cache.nixos.org has nothing built here, so
      # without this every run compiles apps/notes (about 400 crates) again. The store is saved to
      # GitHub's Actions cache after a successful build and restored at the start of the next: the
      # newest cache of ci or deploy on this branch, else main's (a PR reads main's caches, not the
      # reverse). Older caches of this workflow and branch are deleted after the save, to stay in
      # the 10 GB quota.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deploy-${{ hashFiles('flake.lock', '**/*.nix', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-deploy-
          purge-created: 0
          purge-primary-key: never
      - name: Build the system
        run: |
          nix build .#deploy.nodes.piabrota.profiles.system.path \
            --no-link --no-update-lock-file --print-build-logs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Secrets live in this environment; protect it in Settings > Environments.
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The store the build job saved, by its exact key; deploy-rs then finds the system built.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deploy-${{ hashFiles('flake.lock', '**/*.nix', '**/Cargo.lock') }}
          save: false

      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          nix run .#deploy-rs -- .#piabrota \
            --hostname "$DEPLOY_HOST" \
            --ssh-user "$SSH_USER" \
            --ssh-opts "-o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --skip-checks \
            -- --no-update-lock-file --print-build-logs

      # Keep the five generations GRUB lists (deploy.nix), delete the rest and every store path
      # nothing refers to, so the small disk holds only what the running system needs.
      - name: Delete what the VPS no longer uses
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" \
            'sudo nix-env --profile /nix/var/nix/profiles/system --delete-generations +5 && sudo nix-collect-garbage'

      - name: Machine specs after the deploy
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          {
            echo '### piabrota after deploy of `'"$GITHUB_SHA"'`'
            echo '```'
            ssh -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" sh -s < scripts/specs.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
