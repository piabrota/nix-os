name: deploy

# Every push to main is deployed to the VPS. The runner builds the system, deploy-rs copies
# it over SSH (the box pulls what cache.nixos.org has) and activates it. If the box cannot
# be reached over SSH after the switch, deploy-rs rolls it back.
#
# Run by hand on any other branch (`gh workflow run deploy.yml --ref drill/<name>`), it only
# builds: a drill. A broken branch then fails like a real deploy, piabrota/agents' deploy-doctor
# diagnoses it and proposes its fix against that branch, and the VPS is never touched.
on:
  push:
    branches: [main]
    # A merge that changes only Markdown leaves the system as it is: nothing to deploy.
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      ssh_user:
        # `h0ffmann` only for the first deploy, before the `deploy` user exists (docs/DEPLOY.md).
        description: SSH user
        type: choice
        options: [deploy, h0ffmann]
        default: deploy

permissions:
  contents: read
  # cache-nix-action deletes this workflow's older caches.
  actions: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Built in its own job, without the prod environment: the build never sees the deploy key, and a
  # deploy that fails to reach the VPS (an SSH timeout) is retried with "Re-run failed jobs",
  # without building again.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner has about 14 GB free, and the Nix store (Hermes's build, with its own nixpkgs, and
      # the restored cache) outgrew it on 2026-11-02 ("No space left on device"). The image's
      # toolchains that nothing here uses give back about 20 GB. The delete takes about 1 min 40 s, so
      # it runs in the background while Nix installs and the cache restores.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost </dev/null >/dev/null 2>&1 &
      - uses: cachix/install-nix-action@v31
      # The runner starts with an empty /nix/store and cache.nixos.org has nothing built here (apps/notes,
      # about 400 crates; Hermes's Python packages and web UI; the site). The store is saved to
      # GitHub's Actions cache after the build and restored at the start of the next run: the newest
      # cache of ci or deploy on this branch, else main's. The key is the commit, so the deploy job
      # below restores exactly this build. Older caches of this workflow and branch are deleted
      # after the save, to stay in the 10 GB quota.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deploy-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-deploy-
          purge-created: 0
          purge-primary-key: never
          # Before the save, collect everything that the GC roots of the next step do not keep:
          # the build-time tools (rustc, node, the crate sources) go, and cache.nixos.org has them.
          gc-max-store-size-linux: 1G
      # The system and the flake inputs are GC roots, so the collection before the save keeps them.
      # Until 2026-11-03 the build used --no-link: the collection deleted the system it had built, the
      # deploy job built all 661 derivations a second time, and the next run built them a third time.
      - name: Build the system
        run: |
          mkdir -p "$HOME/gcroots"
          nix build .#deploy.nodes.piabrota.profiles.system.path \
            --out-link "$HOME/gcroots/system" --no-update-lock-file --print-build-logs
          nix flake archive --json --no-update-lock-file \
            | jq -r '.. | .path? // empty' | sort -u | nl -w1 -s' ' \
            | while read -r n path; do nix-store --add-root "$HOME/gcroots/input-$n" --realise "$path" >/dev/null; done
          nix path-info --closure-size --human-readable "$HOME/gcroots/system"

  deploy:
    needs: build
    # Only main reaches the VPS; any other branch is a drill and stops at the build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets live in this environment; protect it in Settings > Environments.
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The store the build job saved for this commit; deploy-rs then finds the system built and
      # only copies it. If that cache is missing, the newest deploy cache keeps the rebuild small.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deploy-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-deploy-
          save: false

      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          nix run .#deploy-rs -- .#piabrota \
            --hostname "$DEPLOY_HOST" \
            --ssh-user "$SSH_USER" \
            --ssh-opts "-o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --skip-checks \
            -- --no-update-lock-file --print-build-logs

      # Keep the five generations GRUB lists (deploy.nix) and delete the rest. No full garbage
      # collection here: it deleted what the next deploy downloaded again, and took the one vCPU
      # from the services. Nix collects when free disk falls under min-free (deploy.nix), and the
      # weekly nix.gc runs as before.
      - name: Delete old system generations
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" \
            'sudo nix-env --profile /nix/var/nix/profiles/system --delete-generations +5'

      - name: Machine specs after the deploy
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
        run: |
          {
            echo '### piabrota after deploy of `'"$GITHUB_SHA"'`'
            echo '```'
            ssh -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" sh -s < scripts/specs.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
