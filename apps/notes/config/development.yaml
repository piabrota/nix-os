# `cargo loco start` on a laptop: http://localhost:5150/notes, SQLite in this folder.
# Set NOTES_PASSWORD to sign in; without it the wall stays shut.
logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://notes_development.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
