# The director seat of reels-fabric: plans the pictures of the approved screenplay: shotlist and storyboard.
name: reels-director
version: "1.0"
description: Writes the shotlist and the storyboard of one approved screenplay

defaults:
  runtime: omp
  model: anthropic/claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../reels-shared

profiles:
  default:
    summary: Refines the shotlist, makes one still per beat and hands it to the maker
    uses:
      skills: []
      # Both sets of norms land in the AGENTS.md of the seat's own folder, the box's first. The role
      # goes in as a startup file below.
      guidance: [shared:norms, reels-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
