# The integrator seat of wave-forecaster-dev-integrate: wires one source-term package of
# h0ffmann/chaceon into W3SRCE and mod_def.ww3.
name: wf-integrator
version: "1.0"
description: Wires one ported package of h0ffmann/chaceon into the source-term loop

defaults:
  runtime: omp
  model: anthropic/claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../wf-shared

profiles:
  default:
    summary: Wires one package and hands it to the auditor
    uses:
      skills: []
      # Both sets of norms land in the AGENTS.md of the seat's own folder, the box's first. The role
      # goes in as a startup file below.
      guidance: [shared:norms, wf-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
