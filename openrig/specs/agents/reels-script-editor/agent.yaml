# The script-editor seat of reels-fabric: reviews the screenplay against the brief and the lint, approves its hash, edits nothing.
name: reels-script-editor
version: "1.0"
description: Reviews one screenplay against its brief and approves its hash

defaults:
  runtime: omp
  model: anthropic/claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../reels-shared

profiles:
  default:
    summary: Reads the screenplay, writes the review and approves the hash on a pass
    uses:
      skills: []
      # Both sets of norms land in the AGENTS.md of the seat's own folder, the box's first. The role
      # goes in as a startup file below.
      guidance: [shared:norms, reels-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
