# The creative-director seat of reels-fabric: owns the look and the words. The only seat that edits screenplay.json; after approval it makes the shotlist and the storyboard.
name: reels-creative-director
version: "1.0"
description: Writes the screenplay of one reel, then its shotlist and storyboard

defaults:
  runtime: omp
  model: anthropic/claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../reels-shared

profiles:
  default:
    summary: Writes brief.md and screenplay.json, then the shotlist and the stills
    uses:
      skills: []
      # Both sets of norms land in the AGENTS.md of the seat's own folder, the box's first. The role
      # goes in as a startup file below.
      guidance: [shared:norms, reels-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
