# The porter seat of wave-forecaster-dev: translates one WW3 routine of h0ffmann/chaceon. It runs on
# Claude Code, the one seat of the box that does (rigs/wave-forecaster-dev/rig.yaml says why).
name: wf-porter
version: "1.0"
description: Translates one WW3 routine from Fortran to Rust in h0ffmann/chaceon

defaults:
  runtime: claude-code
  model: claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../wf-shared

profiles:
  default:
    summary: Ports one routine to the status translated and hands it to the auditor
    uses:
      skills: []
      # Both sets of norms land in the CLAUDE.md of the seat's own folder, the box's first (OpenRig
      # writes a Claude seat's guidance there, not in AGENTS.md). The role goes in as a startup file below.
      guidance: [shared:norms, wf-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
