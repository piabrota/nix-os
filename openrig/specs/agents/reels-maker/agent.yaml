# The maker seat of reels-fabric: builds the reel from the shotlist with the toolkit.
name: reels-maker
version: "1.0"
description: Builds one reel from the approved screenplay and its shotlist

defaults:
  runtime: omp
  model: anthropic/claude-sonnet-5-5

imports:
  - ref: local:../shared
  - ref: local:../reels-shared

profiles:
  default:
    summary: Renders the scenes, the music and the mix, and assembles reel.mp4
    uses:
      skills: []
      # Both sets of norms land in the AGENTS.md of the seat's own folder, the box's first. The role
      # goes in as a startup file below.
      guidance: [shared:norms, reels-shared:norms]
      subagents: []
      plugins: []
      runtime_resources: []

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
      orientation: role
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
