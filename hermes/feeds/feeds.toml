# The personal feed of the owner. Read by hermes/feeds/build_feed.py (docs/FEEDS.md).
# A source below answered on 2026-11-04. A source that failed that day is not here: see docs/FEEDS.md.
title = "piabrota - personal feed"

[output]
max_items = 80          # entries in feed.atom
max_per_group = 14      # most entries one group places in the first pass
max_age_days = 21       # default age limit of an item
min_score = 4.0         # an item below this score is dropped (pinned items stay)
digest_items = 18       # items in digest.md and in the stdout digest
digest_per_group = 3    # most digest items of one group
digest_min_score = 6.0  # an item must reach this to be sent on stdout
digest_max_chars = 1900 # Discord cuts a message at 2000
pinned_keep = 3

[negative]
terms = ["airdrop", "nft", "memecoin", "crypto token", "giveaway", "casino", "onlyfans"]

[[group]]
id = "hermes"
title = "Hermes Agent and building in public"
[[group]]
id = "agents"
title = "Coding agents and Claude"
[[group]]
id = "nix"
title = "Nix and self-hosting"
[[group]]
id = "lang"
title = "Rust, Gleam and Loco"
[[group]]
id = "science"
title = "Waves, ocean and HPC"
[[group]]
id = "podcasts"
title = "Podcasts"

