/text><text fill="#6B6B6B" font-size="15" x="144" y="1452">Alerts from official sources only, to Discord and an Atom feed with CAP 1.2. First: floods</text><text fill="#6B6B6B" font-size="15" x="144" y="1474">in the south of Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1422">piabrota.art/alerts</text><text fill="#A86B00" font-size="13" x="916" y="1446">coming · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="1470"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  48 human · 0 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1502" y2="1502"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1538">11</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1538">rax</text><text fill="#6B6B6B" font-size="15" x="144" y="1568">Rustic Agentic Runtime: a pure-Rust port of AX, the declarative orchestrator for agentic</text><text fill="#6B6B6B" font-size="15" x="144" y="1590">tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1538">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="13" x="916" y="1562">no site yet · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="1586"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  17 human · 18 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1618" y2="1618"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1654">12</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1654">agents</text><text fill="#6B6B6B" font-size="15" x="144" y="1684">Small agents that watch nix-os and its VPS, and report on GitHub as piabrota-ops. They</text><text fill="#6B6B6B" font-size="15" x="144" y="1706">open pull requests and never merge.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1654">github.com/piabrota/agents</text><text fill="#6B6B6B" font-size="13" x="916" y="1678">no site yet · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="1702"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  21 human · 0 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1734" y2="1734"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1770">13</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1770">nix-os</text><text fill="#6B6B6B" font-size="15" x="144" y="1800">The NixOS configuration of the small VPS that serves piabrota.art. Judged by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1770">piabrota.art/nixos</text><text fill="#2E7D32" font-size="13" x="916" y="1794">live · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="1818"><title>Commits on the 