monospace, monospace" font-size="12" x="916" y="902"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  142 human · 0 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="934" y2="934"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="970">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="970">closed-source</text><text fill="#6B6B6B" font-size="15" x="144" y="1000">The god that failed: a book on why closed source failed as a protection, for science</text><text fill="#6B6B6B" font-size="15" x="144" y="1022">first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="970">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="13" x="916" y="994">live · CC BY 4.0, AGPL-3.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1046" y2="1046"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1082">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1082">skills</text><text fill="#6B6B6B" font-size="15" x="144" y="1112">A swiss army knife of agent skills.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1082">piabrota.art/skills/</text><text fill="#2E7D32" font-size="13" x="916" y="1106">live · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="1130"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</