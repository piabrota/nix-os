ce, monospace" font-size="13" x="64" y="2110">16</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="2110">ihero</text><text fill="#6B6B6B" font-size="15" x="144" y="2140">A FOSS music player and game, in Rust. Coming: the repository holds only its licence.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="2110">github.com/piabrota/ihero</text><text fill="#A86B00" font-size="13" x="916" y="2134">coming · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="2158"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  1 human · 0 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="2190" y2="2190"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="2226">17</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="2226">ondecomer</text><text fill="#6B6B6B" font-size="15" x="144" y="2256">A site that lists the restaurants of Brazil, with filters for category, location and more.</text><text fill="#6B6B6B" font-size="15" x="144" y="2278">For now it covers only the city of Rio de Janeiro.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="2226">aracyla.github.io/onde-comer</text><text fill="#2E7D32" font-size="13" x="916" y="2250">live · Apache-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="2302" y2="2302"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="2338">18</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="2338">proof</text><text fill="#6B6B6B" font-size="15" x="144" y="2368">Specifications written and proved in Lean 4, with Haskell and Rust implementations checked</text><text fill="#6B6B6B" font-size="15" x="144" y="2390">against them, and data experiments with papers.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="2338">proof.piabrota.art</text><text fill="#2E7D32" font-size="13" x="916" y="2362">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="2414" y2="2414"/><text fill="#6B6B6B" font-size="15" x="64" y="2464">Each project is its own repository, with its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="64" y="2486">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="64" y="2532">Partnerships: mhoffmannfs [at] gmail.com</text>
