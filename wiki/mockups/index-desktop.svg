<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1266" viewBox="0 0 1280 1266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup B, index: the piabrota.art homepage, 1280 px wide">
<title>Mockup B, index: the piabrota.art homepage, 1280 px wide</title>
<defs></defs>
<rect fill="#FAFAF7" height="1266" width="1280" x="0" y="0"/>
<g><rect fill="#BC2318" height="28" rx="5" width="28" x="64" y="28"/><path d="M67 42 Q78 34 89 42 Q78 50 67 42Z" fill="#F7F3EA"/><circle cx="78" cy="42" fill="#2E9E4F" r="3"/><circle cx="78" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="104" y="49">piabrota</text><text fill="#6B6B6B" font-size="14" x="1068" y="49">github.com/piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="150" letter-spacing="-2" x="57" y="260">PIABROTA</text><text fill="#6B6B6B" font-size="18" x="64" y="304">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="64" x2="1216" y1="340" y2="340"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="390">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="390">pirsig</text><text fill="#6B6B6B" font-size="15" x="144" y="420">A second brain: PARA and a Zettelkasten slip-box in one place. Desktop app, REST API and</text><text fill="#6B6B6B" font-size="15" x="144" y="442">the psg CLI.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="390">piabrota.art/pirsig</text><text fill="#A86B00" font-size="13" x="916" y="414">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="466" y2="466"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="502">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="502">gramatico</text><text fill="#6B6B6B" font-size="15" x="144" y="532">Rewrites technical text in Brazilian Portuguese so that it reads once. A Claude Code</text><text fill="#6B6B6B" font-size="15" x="144" y="554">plugin.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="502">piabrota.github.io/gramatico</text><text fill="#2E7D32" font-size="13" x="916" y="526">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="578" y2="578"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="614">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="614">closed-source</text><text fill="#6B6B6B" font-size="15" x="144" y="644">The god that failed: a book on why closed source failed as a protection, for science</text><text fill="#6B6B6B" font-size="15" x="144" y="666">first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="614">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="13" x="916" y="638">live · CC BY 4.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="690" y2="690"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="726">04</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="726">alerts</text><text fill="#6B6B6B" font-size="15" x="144" y="756">Alerts from official sources only, to Discord and an Atom feed with CAP 1.2. First: floods</text><text fill="#6B6B6B" font-size="15" x="144" y="778">in the south of Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="726">piabrota.art/alerts</text><text fill="#A86B00" font-size="13" x="916" y="750">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="802" y2="802"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="838">05</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="838">rax</text><text fill="#6B6B6B" font-size="15" x="144" y="868">Rustic Agentic Runtime: a pure-Rust port of AX, the declarative orchestrator for agentic</text><text fill="#6B6B6B" font-size="15" x="144" y="890">tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="838">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="13" x="916" y="862">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="914" y2="914"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="950">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="950">nix-os</text><text fill="#6B6B6B" font-size="15" x="144" y="980">The NixOS configuration of the small VPS that serves piabrota.art. Judged by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="950">piabrota.art/nixos</text><text fill="#2E7D32" font-size="13" x="916" y="974">live · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1008" y2="1008"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="1044">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="1044">ihero</text><text fill="#6B6B6B" font-size="15" x="144" y="1074">A FOSS music player and game, in Rust. Coming.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="1044">no repository yet</text><text fill="#A86B00" font-size="13" x="916" y="1068">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="1102" y2="1102"/><text fill="#6B6B6B" font-size="15" x="64" y="1152">Each project is its own repository, with its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="64" y="1174">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="64" y="1220">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
