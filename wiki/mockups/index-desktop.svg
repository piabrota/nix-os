<g><rect fill="#BC2318" height="28" rx="5" width="28" x="64" y="28"/><path d="M67 42 Q78 34 89 42 Q78 50 67 42Z" fill="#F7F3EA"/><circle cx="78" cy="42" fill="#2E9E4F" r="3"/><circle cx="78" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="104" y="49">piabrota</text><text fill="#6B6B6B" font-size="14" x="1068" y="49">github.com/piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="150" letter-spacing="-2" x="57" y="260">PIABROTA</text><text fill="#6B6B6B" font-size="18" x="64" y="304">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="64" x2="1216" y1="340" y2="340"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="390">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="390">mu</text><text fill="#6B6B6B" font-size="15" x="144" y="420">The company chart: the dogma, the standards, the journal and the index of the org's</text><text fill="#6B6B6B" font-size="15" x="144" y="442">repositories.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="390">github.com/piabrota/mu</text><text fill="#6B6B6B" font-size="13" x="916" y="414">no site yet · CC BY 4.0, AGPL-3.0, MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="438"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  35 human · 72 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="470" y2="470"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="506">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="506">dojo</text><text fill="#6B6B6B" font-size="15" x="144" y="536">The umbrella: every product as a submodule at a pinned commit, the routing table and its</text><text fill="#6B6B6B" font-size="15" x="144" y="558">own tooling. It holds no product code.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="506">github.com/piabrota/dojo</text><text fill="#6B6B6B" font-size="13" x="916" y="530">no site yet · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="554"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMMITS</tspan>  8 human · 0 agent</text><line stroke="#DEDBD2" x1="64" x2="1216" y1="586" y2="586"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="64" y="622">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="144" y="622">.github</text><text fill="#6B6B6B" font-size="15" x="144" y="652">The org's profile, with the project table, the fabric figure and the funding links.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="916" y="622">github.com/piabrota/.github</text><text fill="#6B6B6B" font-size="13" x="916" y="646">no site yet · MPL-2.0</text><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="916" y="670"><title>Commits on the default branch, as of 2026-11-09. Agent: a bot account or the claude account. A commit that a person made with an agent's help counts as human.</title><tspan font-family="Inter, sans-serif" font-size="11" font-weigh