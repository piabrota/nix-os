<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1848" viewBox="0 0 390 1848" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup B, index: the piabrota.art homepage, 390 px wide">
<title>Mockup B, index: the piabrota.art homepage, 390 px wide</title>
<defs></defs>
<rect fill="#FAFAF7" height="1848" width="390" x="0" y="0"/>
<g><rect fill="#BC2318" height="28" rx="5" width="28" x="20" y="28"/><path d="M23 42 Q34 34 45 42 Q34 50 23 42Z" fill="#F7F3EA"/><circle cx="34" cy="42" fill="#2E9E4F" r="3"/><circle cx="34" cy="42" fill="#0B0D12" r="1"/></g><text fill="#1B1B1B" font-size="16" font-weight="600" x="60" y="49">piabrota</text><text fill="#BC2318" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="64" letter-spacing="-2" x="17" y="174">PIABROTA</text><text fill="#6B6B6B" font-size="15" x="20" y="218">open software fabric · made in RJ</text><line stroke="#1B1B1B" stroke-width="2" x1="20" x2="370" y1="254" y2="254"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="304">01</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="304">pirsig</text><text fill="#6B6B6B" font-size="15" x="64" y="334">A second brain: PARA and a</text><text fill="#6B6B6B" font-size="15" x="64" y="356">Zettelkasten slip-box in one place.</text><text fill="#6B6B6B" font-size="15" x="64" y="378">Desktop app, REST API and the psg</text><text fill="#6B6B6B" font-size="15" x="64" y="400">CLI.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="428">piabrota.art/pirsig</text><text fill="#A86B00" font-size="12" x="64" y="450">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="486" y2="486"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="522">02</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="522">gramatico</text><text fill="#6B6B6B" font-size="15" x="64" y="552">Rewrites technical text in Brazilian</text><text fill="#6B6B6B" font-size="15" x="64" y="574">Portuguese so that it reads once. A</text><text fill="#6B6B6B" font-size="15" x="64" y="596">Claude Code plugin.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="624">piabrota.github.io/gramatico</text><text fill="#2E7D32" font-size="12" x="64" y="646">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="682" y2="682"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="718">03</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="718">closed-source</text><text fill="#6B6B6B" font-size="15" x="64" y="748">The god that failed: a book on why</text><text fill="#6B6B6B" font-size="15" x="64" y="770">closed source failed as a protection,</text><text fill="#6B6B6B" font-size="15" x="64" y="792">for science first.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="820">h0ffmann.github.io/closed-source</text><text fill="#2E7D32" font-size="12" x="64" y="842">live · CC BY 4.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="878" y2="878"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="914">04</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="914">alerts</text><text fill="#6B6B6B" font-size="15" x="64" y="944">Alerts from official sources only, to</text><text fill="#6B6B6B" font-size="15" x="64" y="966">Discord and an Atom feed with CAP</text><text fill="#6B6B6B" font-size="15" x="64" y="988">1.2. First: floods in the south of</text><text fill="#6B6B6B" font-size="15" x="64" y="1010">Brazil.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1038">piabrota.art/alerts</text><text fill="#A86B00" font-size="12" x="64" y="1060">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1096" y2="1096"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1132">05</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1132">rax</text><text fill="#6B6B6B" font-size="15" x="64" y="1162">Rustic Agentic Runtime: a pure-Rust</text><text fill="#6B6B6B" font-size="15" x="64" y="1184">port of AX, the declarative</text><text fill="#6B6B6B" font-size="15" x="64" y="1206">orchestrator for agentic tasks.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1234">github.com/piabrota/rax</text><text fill="#6B6B6B" font-size="12" x="64" y="1256">no site yet · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1292" y2="1292"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1328">06</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1328">nix-os</text><text fill="#6B6B6B" font-size="15" x="64" y="1358">The NixOS configuration of the small</text><text fill="#6B6B6B" font-size="15" x="64" y="1380">VPS that serves piabrota.art. Judged</text><text fill="#6B6B6B" font-size="15" x="64" y="1402">by its closure.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1430">piabrota.art/nixos</text><text fill="#2E7D32" font-size="12" x="64" y="1452">live · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1488" y2="1488"/><text fill="#6B6B6B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" x="20" y="1524">07</text><text fill="#1B1B1B" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="24" x="64" y="1524">ihero</text><text fill="#6B6B6B" font-size="15" x="64" y="1554">A FOSS music player and game, in</text><text fill="#6B6B6B" font-size="15" x="64" y="1576">Rust. Coming.</text><text fill="#1B1B1B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="64" y="1604">no repository yet</text><text fill="#A86B00" font-size="12" x="64" y="1626">coming · MPL-2.0</text><line stroke="#DEDBD2" x1="20" x2="370" y1="1662" y2="1662"/><text fill="#6B6B6B" font-size="15" x="20" y="1712">Each project is its own repository, with</text><text fill="#6B6B6B" font-size="15" x="20" y="1734">its own README, licence and tests. The</text><text fill="#6B6B6B" font-size="15" x="20" y="1756">source is open, and so is the method.</text><text fill="#1B1B1B" font-size="13" x="20" y="1802">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
