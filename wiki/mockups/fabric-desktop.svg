<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1459" viewBox="0 0 1280 1459" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Mockup A, fabric: the piabrota.art homepage, 1280 px wide">
<title>Mockup A, fabric: the piabrota.art homepage, 1280 px wide</title>
<defs><radialGradient id="glow" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#BC2318" stop-opacity="0.28"/><stop offset="1" stop-color="#BC2318" stop-opacity="0"/></radialGradient></defs>
<rect fill="#0B0D12" height="1459" width="1280" x="0" y="0"/>
<rect fill="url(#glow)" height="520" width="1280" x="0" y="0"/><g><rect fill="#BC2318" height="36" rx="7" width="36" x="64" y="26"/><path d="M68 44 Q82 34 96 44 Q82 54 68 44Z" fill="#F7F3EA"/><circle cx="82" cy="44" fill="#2E9E4F" r="4"/><circle cx="82" cy="44" fill="#0B0D12" r="2"/></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="22" x="114" y="52">piabrota</text><text fill="#9AA3B2" font-size="15" x="831" y="52">projects</text><text fill="#9AA3B2" font-size="15" x="926" y="52">how it fits</text><text fill="#9AA3B2" font-size="15" x="1046" y="52">board</text><text fill="#9AA3B2" font-size="15" x="1116" y="52">partnerships</text><text fill="#BC2318" font-size="13" font-weight="600" letter-spacing="2" x="64" y="150">OPEN SOFTWARE FABRIC · MADE IN RJ</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="60" x="64" y="234">Open software, made in</text><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="60" x="64" y="301">Rio de Janeiro.</text><text fill="#9AA3B2" font-size="19" x="64" y="350">Each project is its own repository, with its own README, licence</text><text fill="#9AA3B2" font-size="19" x="64" y="379">and tests. The source is open, and so is the method.</text><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="57" x="64" y="413"/><text fill="#EDEFF3" font-size="13" x="78" y="433">FOSS</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="100" x="133" y="413"/><text fill="#EDEFF3" font-size="13" x="147" y="433">Rust first</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="78" x="245" y="413"/><text fill="#EDEFF3" font-size="13" x="259" y="433">MPL-2.0</text></g><g><rect fill="none" height="30" rx="15" stroke="#2A303C" width="108" x="335" y="413"/><text fill="#EDEFF3" font-size="13" x="349" y="433">made in Rio</text></g><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="30" x="64" y="523">Projects</text><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="571">THINK AND WRITE</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="631">pirsig</text><text fill="#9AA3B2" font-size="12" x="84" y="653">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="683">A second brain: PARA and a Zettelkasten</text><text fill="#9AA3B2" font-size="14" x="84" y="703">slip-box in one place. Desktop app, REST</text><text fill="#9AA3B2" font-size="14" x="84" y="723">API and the psg CLI.</text><circle cx="90" cy="757" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="762">piabrota.art/pirsig</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="631">gramatico</text><text fill="#9AA3B2" font-size="12" x="474" y="653">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="683">Rewrites technical text in Brazilian</text><text fill="#9AA3B2" font-size="14" x="474" y="703">Portuguese so that it reads once. A Claude</text><text fill="#9AA3B2" font-size="14" x="474" y="723">Code plugin.</text><circle cx="480" cy="757" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="762">piabrota.github.io/gramatico</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="593"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="631">closed-source</text><text fill="#9AA3B2" font-size="12" x="864" y="653">Markdown · CC BY 4.0</text><text fill="#9AA3B2" font-size="14" x="864" y="683">The god that failed: a book on why closed</text><text fill="#9AA3B2" font-size="14" x="864" y="703">source failed as a protection, for science</text><text fill="#9AA3B2" font-size="14" x="864" y="723">first.</text><circle cx="870" cy="757" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="762">h0ffmann.github.io/closed-source</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="827">WARN AND HOST</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="887">alerts</text><text fill="#9AA3B2" font-size="12" x="84" y="909">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="939">Alerts from official sources only, to</text><text fill="#9AA3B2" font-size="14" x="84" y="959">Discord and an Atom feed with CAP 1.2.</text><text fill="#9AA3B2" font-size="14" x="84" y="979">First: floods in the south of Brazil.</text><circle cx="90" cy="1013" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1018">piabrota.art/alerts</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="454" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="474" y="887">rax</text><text fill="#9AA3B2" font-size="12" x="474" y="909">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="474" y="939">Rustic Agentic Runtime: a pure-Rust port of</text><text fill="#9AA3B2" font-size="14" x="474" y="959">AX, the declarative orchestrator for</text><text fill="#9AA3B2" font-size="14" x="474" y="979">agentic tasks.</text><circle cx="480" cy="1013" fill="#5B6474" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="494" y="1018">github.com/piabrota/rax</text></g><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="844" y="849"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="864" y="887">nix-os</text><text fill="#9AA3B2" font-size="12" x="864" y="909">Nix · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="864" y="939">The NixOS configuration of the small VPS</text><text fill="#9AA3B2" font-size="14" x="864" y="959">that serves piabrota.art. Judged by its</text><text fill="#9AA3B2" font-size="14" x="864" y="979">closure.</text><circle cx="870" cy="1013" fill="#2E9E4F" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="884" y="1018">piabrota.art/nixos</text></g><text fill="#9AA3B2" font-size="12" font-weight="600" letter-spacing="2" x="64" y="1083">PLAY</text><g><rect fill="#14171F" height="190" rx="10" stroke="#2A303C" width="370" x="64" y="1105"/><text fill="#EDEFF3" font-family="'Fjalla One', 'Arial Narrow', Inter, sans-serif" font-size="21" x="84" y="1143">ihero</text><text fill="#9AA3B2" font-size="12" x="84" y="1165">Rust · MPL-2.0</text><text fill="#9AA3B2" font-size="14" x="84" y="1195">A FOSS music player and game, in Rust.</text><text fill="#9AA3B2" font-size="14" x="84" y="1215">Coming.</text><circle cx="90" cy="1269" fill="#D9A21B" r="5"/><text fill="#EDEFF3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" x="104" y="1274">no repository yet</text></g><line stroke="#2A303C" x1="64" x2="1216" y1="1359" y2="1359"/><text fill="#9AA3B2" font-size="13" x="64" y="1399">piabrota.art is served by nix-os, from /nix/store.</text><text fill="#9AA3B2" font-size="13" x="64" y="1423">Partnerships: mhoffmannfs [at] gmail.com</text>
</svg>
